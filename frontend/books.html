<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Section</title>
    <link rel="stylesheet" href="css/books.css" />
    <script
      src="https://kit.fontawesome.com/1a9471f516.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navdiv">
          <img id="logo" src="images/logo2.png" alt="Book Store Logo" />

          <ul>
            <li class="hover-text"><a href="index.html">Home</a></li>
            <li class="hover-text"><a href="books.html">Books</a></li>
            <li class="hover-text"><a href="login.html">Login</a></li>
            <li class="hover-text"><a href="cart.html">Cart</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <section class="booksection">
        <h1 id="pagetitle">Book Section</h1>

        <div class="search">
          <input type="text" placeholder="search book..." id="searchbook" />
          <button id="find">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <div class="category">
          <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Self Help">Self Help</option>
            <option value="Fiction">Fiction</option>
            <option value="Programming">Programming</option>
            <option value="Business">Business</option>
          </select>
        </div>

        <div class="container">
          <!-- <div class="book">
                    <img>
                    <p id="title">Title:</p>
                    <p id="author">Author:</p>
                    <p id="price">Price:</p>
                    <p id="category">Category:</p>
                    <button class="btn">View Details</button>
                </div> -->
        </div>
      </section>
    </main>

    <script src="javascript/books.js"></script>
  </body>
</html>
