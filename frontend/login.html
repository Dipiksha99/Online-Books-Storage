<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navdiv">
          <img id="logo" src="images/logo2.png" alt="Book Store Logo" />

          <ul>
            <li class="hover-text"><a href="index.html">Home</a></li>
            <li class="hover-text"><a href="books.html">Books</a></li>
            <li class="hover-text"><a href="login.html">Login</a></li>
            <li class="hover-text"><a href="cart.html">Cart</a></li>
            <li class="hover-text"><a href="orders.html">My Orders</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <form id="loginForm">
        <h1>Login Account</h1>
        <div>
          <label> Email :</label>
          <input type="email" id="email" placeholder="Enter your Email" />
        </div>
        <div>
          <label> Password : </label>
          <input type="password" id="password" placeholder="Enter Password" />
        </div>
        <button type="submit">Login</button>
        <p id="message"></p>
        <p>Don't have an account?</p>

        <button type="button">
          <a href="register.html">Register</a>
        </button>
      </form>
    </main>

    <script src="javascript/login.js"></script>
  </body>
</html>
