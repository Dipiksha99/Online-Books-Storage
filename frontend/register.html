<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Book</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navdiv">
          <img id="logo" src="images/logo2.png" alt="Book Store Logo" />

          <ul>
            <li class="hover-text"><a href="index.html">Home</a></li>
            <li class="hover-text"><a href="books.html">Books</a></li>
            <li class="hover-text"><a href="login.html">Login</a></li>
            <li class="hover-text"><a href="cart.html">Cart</a></li>
            <li class="hover-text"><a href="orders.html">My Orders</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <form id="registerForm">
        <h1>Create Account</h1>
        <div>
          <label>Full Name :</label>
          <input type="text" id="name" placeholder="Enter Full Name" />
        </div>
        <div>
          <label> Email :</label>
          <input type="email" id="email" placeholder="Enter your Email" />
        </div>
        <div>
          <label> Password : </label>
          <input type="password" id="password" placeholder="Enter Password" />
        </div>
        <div>
          <label>Confirm Password :</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="ReEnter Password"
          />
        </div>
        <button type="submit">Register</button>
        <p id="message"></p>
        <p>Already have an account?</p>
        <button type="button"><a href="login.html">Login</a></button>
      </form>
    </main>

    <script src="javascript/register.js"></script>
  </body>
</html>
